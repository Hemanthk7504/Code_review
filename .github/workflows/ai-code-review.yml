name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    # do not review the bot's own revision PRs
    if: ${{ !startsWith(github.head_ref, 'ai-review/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run AI Review & Auto-Revision PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.NVIDIA_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://integrate.api.nvidia.com/v1' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'nvidia/nemotron-3.5-lightning-30b-a3b' }}
          REVIEW_API_URL: ${{ secrets.REVIEW_API_URL }}
          REVIEW_API_KEY: ${{ secrets.REVIEW_API_KEY }}
        run: |
          if [ -n "$REVIEW_API_URL" ]; then
            echo "Delegating PR review to external backend at $REVIEW_API_URL..."
            curl --fail-with-body -sS -X POST "$REVIEW_API_URL/api/v1/github/pull-request" \
              -H "Content-Type: application/json" \
              -H "X-API-Key: $REVIEW_API_KEY" \
              -d "{\"repo\": \"${{ github.repository }}\", \"pr_number\": ${{ github.event.pull_request.number }}, \"github_token\": \"$GITHUB_TOKEN\"}"
          else
            echo "Running autonomous CodeSentinel review engine in GitHub Action runner..."
            python -m backend.app.cli_review_pr \
              --repo "${{ github.repository }}" \
              --pr ${{ github.event.pull_request.number }} \
              --token "$GITHUB_TOKEN"
          fi

